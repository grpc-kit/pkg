      option:
        tags:
          - "角色管理"
        summary: "角色主体绑定列表"
        description: "接口格式：/builtin/admin/api/v1/roles/{parent}/members。parent 表示角色 ID。默认返回第一层主体绑定（bindings）；view=VIEW_FULL 时，members 返回展开后的有效用户 membership 结果。"
        responses:
          "200":
            examples:
              "application/json": '{"bindings":[{"id":"10","principal_type":"USER","principal_id":"1","principal_name":"系统管理员","principal_code":"admin","role_id":"2001","binding_status":"ACTIVE"},{"id":"11","principal_type":"GROUP","principal_id":"20","principal_name":"运维团队","principal_code":"ops-team","role_id":"2001","binding_status":"ACTIVE"},{"id":"12","principal_type":"DEPARTMENT","principal_id":"5001","principal_name":"风控中心","principal_code":"risk-center","role_id":"2001","binding_status":"DISABLED"}],"members":[],"next_page_token":"role-bindings:3","total_size":3}'
