        summary: "创建角色主体绑定"
        description: '接口格式：POST /builtin/admin/api/v1/roles/{parent}/members。parent 为角色 ID；请求体为 bindings 数组，如 [{"principal_type":"USER","principal_id":"1001","binding_status":"ACTIVE"},{"principal_type":"GROUP","principal_id":"20","binding_status":"ACTIVE"}]。'
        responses:
          "200":
            examples:
              "application/json": '{}'
    - method: grpc_kit.api.known.admin.v1.KnownAdmin.UpdateRoleMembers
      option:
        tags:
          - "角色管理"
        summary: "更新角色主体绑定"
        description: '接口格式：PATCH /builtin/admin/api/v1/roles/{parent}/members。parent 为角色 ID；请求体为 bindings 数组。每行可通过 id 或 principal_type + principal_id 定位，支持更新 binding_status、expires_at、metadata、description。示例：[{"id":"10","principal_type":"USER","principal_id":"1","binding_status":"ACTIVE","description":"平台管理员直绑"}]。'
        responses:
          "200":
            examples:
              "application/json": '{}'
