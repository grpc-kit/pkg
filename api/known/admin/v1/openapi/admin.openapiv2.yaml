        summary: "更新角色"
        description: '接口格式：/builtin/admin/api/v1/roles/{role.id}。路径中的 role.id 应与请求体一致，支持 update_mask。请求体示例：{"role":{"id":"2","display_name":"审计员（高级）","sort_order":25},"update_mask":{"paths":["display_name","sort_order"]}}。'
