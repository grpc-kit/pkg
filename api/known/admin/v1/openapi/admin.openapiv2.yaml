        description: '接口格式：/builtin/admin/api/v1/auth/mfa/verify。在 CreateAuthLogin 返回 mfa_required=true 后，前端调用此接口完成 TOTP 二步验证。前置条件：challenge_id 必须来自未过期登录挑战，服务端应审计验证失败次数并禁止重复使用已完成挑战。请求体示例：{"challenge_id":"uuid-xxx","totp_code":"123456"}。'
        responses:
          "200":
            examples:
              "application/json": '{"access_token":"eyJhbGci...","token_type":"Bearer","expires_in":86400}'
    - method: grpc_kit.api.known.admin.v1.KnownAdmin.StartAuthMFASetup
      option:
        tags:
          - "MFA 多因素认证"
        summary: "登录态首次配置 MFA（开始）"
