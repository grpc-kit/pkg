        summary: "移除角色主体绑定"
        description: "接口格式：/builtin/admin/api/v1/roles/{parent}/members/{principal_type}/{principal_id}。parent 表示角色 ID；支持删除 USER / GROUP / DEPARTMENT 三类主体绑定。"
        responses:
          "200":
            examples:
