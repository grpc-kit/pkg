        summary: "获取角色详情"
        description: "接口格式：/builtin/admin/api/v1/roles/{id}。根据角色 ID 获取详情。"
        responses:
          "200":
            examples:
              "application/json": '{"id":"2","parent_id":"1","code":"auditor","display_name":"审计员","sort_order":30,"type":"CUSTOM","status":"ACTIVE","description":"审计报表与日志查看角色"}'
    - method: grpc_kit.api.known.admin.v1.KnownAdmin.UpdateRole
      option:
