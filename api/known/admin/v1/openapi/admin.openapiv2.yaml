        summary: "创建角色"
        description: '接口格式：/builtin/admin/api/v1/roles。根据 role 字段创建角色。请求体示例：{"role":{"parent_id":"1","code":"auditor","display_name":"审计员","type":"CUSTOM","status":"ACTIVE"}}。'
        responses:
          "200":
            examples:
              "application/json": '{"id":"2","parent_id":"1","code":"auditor","display_name":"审计员","sort_order":30,"type":"CUSTOM","status":"ACTIVE","description":"审计报表与日志查看角色"}'
    - method: grpc_kit.api.known.admin.v1.KnownAdmin.GetRole
      option:
        tags:
